<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>This is for my boy</title>

<style>

/* =====================================================
   ROOT
===================================================== */

:root {
  --bg: #070c10;
  --incoming: #20272e;
  --outgoing: #075a78;
  --text: #f1f5f7;
  --muted: #91a3ad;
  --accent: #1685ae;
}


/* =====================================================
   GLOBAL
===================================================== */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100dvh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 12px;

  background:
    radial-gradient(
      ellipse at center,
      #315767,
      #173947 55%,
      #10232e
    );

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  color: var(--text);
}


/* =====================================================
   LAYOUT
===================================================== */

.layout {
  width: 100%;

  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 10px;
}


/* =====================================================
   PHONE
===================================================== */

.phone {
  width: min(100%, 360px);

  height:
    min(
      780px,
      calc(100dvh - 90px)
    );

  min-height: 500px;

  padding: 7px;

  border-radius: 42px;

  background:
    linear-gradient(
      135deg,
      #a7b3b8,
      #172128 20%,
      #020609 48%,
      #647179 80%,
      #080d10
    );

  box-shadow:
    0 22px 55px #0007,
    inset 0 0 0 1px #c0c9cc;
}


.screen {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border-radius: 35px;

  background: var(--bg);

  border: 1px solid #263139;
}


/* =====================================================
   STATUS BAR
===================================================== */

.island {
  position: absolute;

  z-index: 20;

  top: 8px;
  left: 50%;

  transform: translateX(-50%);

  width: 90px;
  height: 23px;

  border-radius: 20px;

  background: #020406;

  border: 1px solid #1c252b;
}

.status {
  position: absolute;

  z-index: 21;

  top: 0;
  left: 0;

  width: 100%;
  height: 38px;

  padding:
    12px
    20px
    0;

  display: flex;

  justify-content: space-between;
  align-items: flex-start;

  color: white;

  font-size: 10px;
  font-weight: 750;

  pointer-events: none;
}

.status-right {
  display: flex;

  align-items: center;

  gap: 5px;
}

.signal {
  font-size: 10px;
  letter-spacing: -2px;
}

.battery {
  width: 16px;
  height: 8px;

  border: 1px solid white;

  border-radius: 2px;

  position: relative;
}

.battery::before {
  content: "";

  position: absolute;

  top: 1px;
  bottom: 1px;
  left: 1px;

  width: 75%;

  background: white;

  border-radius: 1px;
}

.battery::after {
  content: "";

  position: absolute;

  right: -3px;
  top: 2px;

  width: 2px;
  height: 3px;

  background: white;
}


/* =====================================================
   HOME SCREEN
===================================================== */

.home {
  position: absolute;

  inset: 0;

  display: flex;

  flex-direction: column;

  overflow-y: auto;

  padding:
    70px
    17px
    22px;

  background:
    radial-gradient(
      ellipse at 15% 20%,
      #f5b7c9a6,
      transparent 35%
    ),
    radial-gradient(
      ellipse at 90% 60%,
      #7db9d6a6,
      transparent 40%
    ),
    linear-gradient(
      155deg,
      #394f79,
      #b1a4c6 48%,
      #e6c7d3
    );

  transition:
    opacity .25s ease,
    transform .3s ease;
}

.home.hidden {
  opacity: 0;

  pointer-events: none;

  transform: scale(1.04);

  visibility: hidden;
}


/* =====================================================
   CLOCK
===================================================== */

.date-line {
  text-align: center;

  color: white;

  font-size: 12px;

  font-weight: 500;

  text-shadow:
    0 1px 7px #0002;
}

.big-clock {
  margin-top: 5px;

  text-align: center;

  color: white;

  font-size:
    clamp(
      56px,
      17vw,
      76px
    );

  line-height: 1.05;

  font-weight: 250;

  letter-spacing: -3px;
}

.widget-label {
  text-align: center;

  color: white;

  font-size: 10px;

  margin-top: 7px;

  opacity: .9;
}


/* =====================================================
   NOTIFICATION
===================================================== */

.notifications {
  margin-top: 35px;

  display: flex;

  flex-direction: column;

  gap: 9px;
}

.notification {
  width: 100%;

  padding: 13px;

  border:
    1px solid
    #ffffff45;

  border-radius: 20px;

  background:
    #f7f8f9d9;

  color: #252b34;

  text-align: left;

  cursor: pointer;

  box-shadow:
    0 5px 18px #26344b16;

  backdrop-filter:
    blur(18px);
}

.notification-top {
  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 8px;

  font-size: 9px;

  color: #565d68;
}

.notification-app {
  display: flex;

  align-items: center;

  gap: 6px;

  font-weight: 700;

  letter-spacing: .3px;
}

.wa-icon {
  display: grid;

  place-items: center;

  width: 22px;
  height: 22px;

  border-radius: 7px;

  color: white;

  background: #20bd67;

  font-size: 13px;
}

.notification-body {
  display: flex;

  align-items: flex-start;

  gap: 9px;
}

.notification-avatar {
  flex-shrink: 0;

  display: grid;

  place-items: center;

  width: 36px;
  height: 36px;

  border-radius: 50%;

  background:
    linear-gradient(
      135deg,
      #dce9ef,
      #8eb6c7
    );

  color: #274356;

  font-size: 14px;

  font-weight: 800;
}

.notification-copy {
  flex: 1;

  min-width: 0;
}

.notification-name {
  font-size: 12px;

  font-weight: 750;

  margin-bottom: 4px;
}

.notification-message {
  font-size: 11px;

  line-height: 1.45;

  color: #414752;
}

.notification-hint {
  margin-top: 8px;

  text-align: center;

  color: white;

  font-size: 10px;

  text-shadow:
    0 1px 5px #0002;
}


/* =====================================================
   HOME APPS
===================================================== */

.home-apps {
  margin-top: auto;

  padding-top: 24px;

  display: flex;

  justify-content: center;

  gap: 15px;
}

.app-icon {
  display: grid;

  place-items: center;

  width: 43px;
  height: 43px;

  border-radius: 13px;

  font-size: 20px;

  box-shadow:
    0 4px 12px #0002;
}

.app-phone {
  background: #35c96c;
}

.app-message {
  background: #4dca80;
}

.app-music {
  background:
    linear-gradient(
      135deg,
      #f56b91,
      #9b6fe4
    );
}

.app-camera {
  background:
    linear-gradient(
      135deg,
      #fafafa,
      #aab2bd
    );
}

.home-indicator {
  position: absolute;

  z-index: 30;

  bottom: 6px;

  left: 50%;

  transform:
    translateX(-50%);

  width: 95px;
  height: 4px;

  border-radius: 10px;

  background: white;

  box-shadow:
    0 1px 5px #0003;
}


/* =====================================================
   CHAT ROOM
===================================================== */

.chat-room {
  position: absolute;

  inset: 0;

  display: flex;

  flex-direction: column;

  background: var(--bg);

  opacity: 0;

  pointer-events: none;

  transform:
    translateX(25px);

  transition:
    opacity .25s ease,
    transform .25s ease;

  visibility: hidden;
}

.chat-room.active {
  opacity: 1;

  pointer-events: auto;

  transform:
    translateX(0);

  visibility: visible;
}


/* =====================================================
   CHAT HEADER
===================================================== */

.chat-header {
  margin-top: 37px;

  height: 49px;

  flex-shrink: 0;

  display: flex;

  align-items: center;

  gap: 8px;

  padding:
    4px
    12px
    8px;

  border-bottom:
    1px solid
    #182128;

  background: #0b1116;
}

.back {
  border: none;

  background: transparent;

  color: #83c8e5;

  font-size: 27px;

  padding:
    0
    4px;

  cursor: pointer;
}

.avatar {
  width: 30px;
  height: 30px;

  flex-shrink: 0;

  border-radius: 50%;

  display: grid;

  place-items: center;

  background:
    linear-gradient(
      145deg,
      #e1d6c3,
      #699ba8
    );

  color: #17242a;

  font-size: 11px;

  font-weight: 800;
}

.contact-name {
  font-size: 11px;

  font-weight: 700;
}

.contact-status {
  font-size: 9px;

  color: var(--muted);

  margin-top: 3px;
}

.more {
  margin-left: auto;

  color: #b8c6cc;

  letter-spacing: 2px;
}


/* =====================================================
   CHAT AREA
===================================================== */

.chat {
  flex: 1;

  min-height: 0;

  overflow-y: auto;

  display: flex;

  flex-direction: column;

  gap: 8px;

  padding:
    11px
    8px;

  scroll-behavior: smooth;

  background:
    radial-gradient(
      ellipse at 15% 20%,
      #13232c 0,
      transparent 55%
    ),
    var(--bg);
}

.chat::-webkit-scrollbar {
  width: 0;
}


/* =====================================================
   DATE DIVIDER
===================================================== */

.day-divider {
  align-self: center;

  font-size: 8px;

  color: #9aaab2;

  background: #172128;

  padding:
    5px
    9px;

  border-radius: 8px;

  margin:
    2px
    0
    5px;
}


/* =====================================================
   CHAT MESSAGE
===================================================== */

.msg {
  max-width: 91%;

  align-self: flex-start;

  background:
    var(--incoming);

  border-radius: 12px;

  padding:
    9px
    10px
    6px;

  font-size: 11px;

  line-height: 1.55;

  color: #eef2f4;

  overflow-wrap: anywhere;

  white-space: pre-line;

  animation:
    messageAppear .25s ease-out;
}

.msg.girl {
  align-self: flex-end;

  background:
    var(--outgoing);

  border-bottom-right-radius: 4px;
}

.meta {
  font-size: 8px;

  color: #9aabb4;

  text-align: right;

  margin-top: 4px;
}

.msg.girl .meta {
  color: #b0d5e2;
}


/* =====================================================
   TYPING MESSAGE
===================================================== */

.typing-message {
  max-width: 91%;

  align-self: flex-start;

  background:
    var(--incoming);

  border-radius: 12px;

  padding:
    9px
    12px;

  min-width: 48px;

  animation:
    messageAppear .25s ease-out;
}

.typing-dots {
  display: flex;

  align-items: center;

  gap: 3px;

  height: 12px;
}

.typing-dots span {
  width: 5px;
  height: 5px;

  border-radius: 50%;

  background: #9aaab2;

  animation:
    typingDot
    1.1s
    infinite ease-in-out;
}

.typing-dots span:nth-child(2) {
  animation-delay: .15s;
}

.typing-dots span:nth-child(3) {
  animation-delay: .3s;
}


/* =====================================================
   VOICE NOTE
===================================================== */

.voice-message {
  align-self: flex-start;

  width: 178px;

  max-width: 178px;

  padding:
    8px
    9px
    6px;

  background:
    var(--incoming);

  border-radius: 12px;

  animation:
    messageAppear .25s ease-out;
}

.voice-row {
  width: 100%;

  display: flex;

  align-items: center;

  gap: 8px;
}

.voice-play {
  width: 30px;
  height: 30px;

  flex: 0 0 30px;

  border: none;

  border-radius: 50%;

  display: grid;

  place-items: center;

  background:
    #3c9abc;

  color: white;

  font-size: 11px;

  cursor: pointer;

  padding: 0;
}

.voice-content {
  flex: 1;

  min-width: 0;

  display: flex;

  flex-direction: column;

  justify-content: center;

  gap: 3px;
}

.voice-label {
  font-size: 8px;

  line-height: 1;

  color: #d8e7ed;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.voice-wave {
  width: 100%;

  height: 18px;

  display: flex;

  align-items: center;

  gap: 2px;

  overflow: hidden;
}

.voice-wave span {
  display: block;

  width: 2px;

  min-width: 2px;

  height: var(--bar-height);

  border-radius: 4px;

  background:
    #9fcddd;

  opacity: .9;

  transform-origin: center;
}

.voice-message.playing
.voice-wave span {
  animation:
    voicePulse
    .55s
    ease-in-out
    infinite
    alternate;
}

.voice-message.playing
.voice-wave span:nth-child(2n) {
  animation-delay: .08s;
}

.voice-message.playing
.voice-wave span:nth-child(3n) {
  animation-delay: .15s;
}

.voice-bottom {
  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-top: 2px;

  padding-left: 38px;
}

.voice-duration {
  font-size: 7px;

  color: #9caeb7;
}

.voice-time {
  font-size: 7px;

  color: #9caeb7;

  margin-left: auto;
}


/* =====================================================
   FINAL PHOTO
===================================================== */

.final-photo {
  width: min(100%, 250px);

  max-height: 250px;

  object-fit: cover;

  border-radius: 12px;

  display: block;

  margin-top: 6px;

  border:
    1px solid
    #49606c;
}


/* =====================================================
   CHOICES
===================================================== */

.choices {
  flex-shrink: 0;

  display: flex;

  flex-direction: column;

  gap: 6px;

  padding:
    9px;

  background: #101920;

  border-top:
    1px solid
    #202e36;

  max-height: 32%;

  overflow-y: auto;
}

.choices-title {
  font-size: 10px;

  color: #9db4c0;

  text-align: center;

  margin-bottom: 2px;
}

.choice {
  border:
    1px solid
    #31566a;

  background:
    #142c39;

  color:
    #e8f5fa;

  border-radius: 13px;

  padding: 10px;

  text-align: center;

  font-size: 11px;

  line-height: 1.4;

  cursor: pointer;
}

.choice:disabled {
  opacity: .5;

  cursor: default;
}


/* =====================================================
   COMPOSER
===================================================== */

.composer {
  height: 43px;

  flex-shrink: 0;

  border-top:
    1px solid
    #1b242a;

  background: #080c0f;

  display: flex;

  align-items: center;

  gap: 8px;

  padding:
    5px
    9px;
}

.plus {
  font-size: 19px;

  color: #a5b8c2;
}

.input {
  height: 29px;

  display: flex;

  align-items: center;

  padding:
    0
    11px;

  border:
    1px solid
    #2d3940;

  background: #151b20;

  border-radius: 20px;

  color: #71848e;

  font-size: 9px;

  flex: 1;

  min-width: 0;
}

.send {
  height: 26px;
  width: 26px;

  border-radius: 50%;

  display: grid;

  place-items: center;

  background:
    var(--accent);

  color: white;

  font-size: 13px;
}


/* =====================================================
   CONTROL
===================================================== */

.controls {
  display: flex;

  justify-content: center;

  gap: 8px;
}

.btn {
  background:
    #123749;

  border:
    1px solid
    #3e758d;

  color:
    #e7f7ff;

  border-radius: 20px;

  padding:
    9px
    15px;

  font-size: 11px;

  font-weight: 600;

  cursor: pointer;
}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes messageAppear {

  from {
    opacity: 0;

    transform:
      translateY(5px);
  }

  to {
    opacity: 1;

    transform:
      translateY(0);
  }

}

@keyframes typingDot {

  0%,
  60%,
  100% {
    opacity: .35;

    transform:
      translateY(0);
  }

  30% {
    opacity: 1;

    transform:
      translateY(-3px);
  }

}

@keyframes voicePulse {

  from {
    transform:
      scaleY(.55);
  }

  to {
    transform:
      scaleY(1.2);
  }

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-height: 650px) {

  .phone {
    height:
      calc(100dvh - 75px);

    min-height: 450px;
  }

  .notifications {
    margin-top: 22px;
  }

  .msg {
    padding:
      6px
      8px
      5px;
  }

  .chat {
    gap: 5px;
  }

  .voice-message {
    padding:
      7px
      9px
      5px;
  }

}

</style>
</head>


<body>

<div class="layout">


  <!-- =================================================
       PHONE
  ================================================== -->

  <div class="phone">

    <div class="screen">


      <!-- =================================================
           STATUS BAR
      ================================================== -->

      <div class="status">

        <span id="statusTime">
          00:00
        </span>

        <span class="status-right">

          <span class="signal">
            ▮▮▮
          </span>

          <span>
            Wi-Fi
          </span>

          <span class="battery"></span>

        </span>

      </div>



      <!-- =================================================
           HOME SCREEN
      ================================================== -->

      <section

      >

        >

        </div>

          <button
            class="notification"
            id="openNotification"

                WHATSAPP

              </span>

            <div class="notification-body">

              <div class="notification-avatar">
                S
              </div>


              <div class="notification-copy">

                <div class="notification-name">
                  Sayang💗
                </div>


                <div
                  class="notification-message"
                  id="notificationMessage"

              </div>

          </button>

        </div>

        <div class="home-apps">

            ☎
          </div>

          <div class="app-icon app-message">
            ●
          </div>

          <div class="app-icon app-music">
            ♫
          </div>

          <div class="app-icon app-camera">
            📷
          </div>

        </div>

      </section>



      <!-- =================================================
           CHAT ROOM
      ================================================== -->

      <section
        class="chat-room"
        id="chatRoom"
      >


        <!-- HEADER -->

        <header class="chat-header">

          <button
            class="back"
            id="backHome"
          >
            ‹
          </button>


          <div class="avatar">
            S
          </div>


          <div>

            <div class="contact-name">
              Sayang💗
            </div>

            <div
              class="contact-status"
              id="chatStatus"
            >
              online
            </div>

          </div>


          <span class="more">
            •••
          </span>

        </header>



        <!-- =================================================
             CHAT
        ================================================== -->

        <main
          class="chat"
          id="chat"
        >

          <div
            class="day-divider"
            id="todayDivider"
          >

          <div

            <div class="voice-row">

              <button
                class="voice-play"
                id="openingPlay"
              >
                ▶
              </button>


              <div class="voice-content">

                <div class="voice-label">
                  Voice note anniversary
                </div>


                <div
                  class="voice-wave"
                  id="openingWave"

              </div>

            </div>


            <div class="voice-bottom">

              <span class="voice-duration">

              </span>


              <span

                id="voiceTime"

                00:00
              </span>

            </div>

          </div>

        </main>



        <!-- =================================================
             CHOICES
        ================================================== -->

        <section
          class="choices"
          id="choices"
        >

          <div

            ▶ Putar VN pembuka dulu
          </button>

        </section>



        <!-- =================================================
             COMPOSER
        ================================================== -->

        <div class="composer">

          <span class="plus">
            ＋
          </span>


          <div
            class="input"
            id="input"
          >
            Menunggu pesan...
          </div>


          <span class="send">
            ➤
          </span>

        </div>


      </section>


      <!-- HOME INDICATOR -->

      <div class="home-indicator"></div>

    </div>

  </div>



  <!-- =================================================
       RESTART
  ================================================== -->

  <div class="controls">

    <button
      class="btn"
      id="restartButton"
    >
      ↻ Ulangi dari awal
    </button>

  </div>

</div>



<!-- =====================================================
     AUDIO
===================================================== -->

<audio
  id="vnAudio"
  preload="auto"
  src="vn.mp4"
></audio>

<audio
  id="bgMusic"
  preload="auto"
  loop
  src="musik.mp3"
></audio>



<script>

/* =====================================================
   ELEMENT
===================================================== */

const home =
  document.getElementById("home");

const chatRoom =
  document.getElementById("chatRoom");

const chat =
  document.getElementById("chat");

const choicesBox =
  document.getElementById("choices");

const audio =
  document.getElementById("vnAudio");

const music =
  document.getElementById("bgMusic");


/* =====================================================
   STATE
===================================================== */

let openingPlayed = false;

let started = false;

let locked = false;

let notificationOpened = false;


/* =====================================================
   CLOCK
===================================================== */

function updateClock() {

  const now = new Date();

  const time =
    now.toLocaleTimeString(
      "id-ID",
      {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }
    );

  const date =
    now.toLocaleDateString(
      "id-ID",
      {
        weekday: "long",
        day: "numeric",
        month: "long"
      }
    );


  document.getElementById(
    "statusTime"
  ).textContent = time;


  document.getElementById(
    "homeClock"
  ).textContent = time;


  document.getElementById(
    "homeDate"
  ).textContent = date;


  document.getElementById(
    "notificationTime"
  ).textContent = time;


  document.getElementById(
    "todayDivider"
  ).textContent =
    date
      .charAt(0)
      .toUpperCase()
    +
    date.slice(1);

}


updateClock();


setInterval(
  updateClock,
  1000
);


/* =====================================================
   CURRENT TIME
===================================================== */

function currentTime() {

  return new Date()
    .toLocaleTimeString(
      "id-ID",
      {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }
    );

}


/* =====================================================
   STAMP
===================================================== */

function stampMessages() {

  document
    .querySelectorAll(
      ".messageTime"
    )
    .forEach(
      element => {

        element.textContent =
          currentTime();

      }
    );

}


/* =====================================================
   OPEN CHAT
===================================================== */

function openChat() {

  if (
    notificationOpened
  ) {
    return;
  }


  notificationOpened = true;


  home.classList.add(
    "hidden"
  );


  chatRoom.classList.add(
    "active"
  );


  document.getElementById(
    "notificationMessage"
  ).textContent =
    "Pesan dibuka ❤️";


  document.getElementById(
    "input"
  ).textContent =
    "Dengerin VN dulu ya...";


  stampMessages();

}


/* =====================================================
   NOTIFICATION
===================================================== */

document
  .getElementById(
    "openNotification"
  )
  .addEventListener(
    "click",
    openChat
  );


/* =====================================================
   BACK
===================================================== */

document
  .getElementById(
    "backHome"
  )
  .addEventListener(
    "click",
    () => {

      chatRoom.classList.remove(
        "active"
      );

      home.classList.remove(
        "hidden"
      );

    }
  );


/* =====================================================
   WAVEFORM
===================================================== */

function createWaveform() {

  const wave =
    document.getElementById(
      "openingWave"
    );


  if (!wave) {
    return;
  }


  const heights = [

    5,9,13,7,15,10,6,12,16,8,

    13,6,10,15,8,12,17,7,13,10,

    15,6,11,16,8,13,7,12,15,9,

    14,6,11,16,8,12,7,14,10,15,

    6,12,8,14,9,13,7,15,10,12

  ];


  wave.innerHTML =
    heights
      .map(
        height =>
          `<span style="--bar-height:${height}px"></span>`
      )
      .join("");

}


createWaveform();


/* =====================================================
   ENABLE CONTINUE
   LANGSUNG SETELAH VN MULAI
===================================================== */

function enableContinueImmediately() {

  openingPlayed = true;


  const button =
    document.getElementById(
      "startChoice"
    );


  if (!button) {
    return;
  }


  button.disabled = false;


  button.textContent =
    "Lanjut baca pesan anniversary ❤️";


  document.getElementById(
    "choiceTitle"
  ).textContent =
    "VN masih boleh diputar, tapi kamu bisa lanjut sekarang 💗";

}


/* =====================================================
   VOICE BUTTON
===================================================== */

function setupVoiceButton() {

  const button =
    document.getElementById(
      "openingPlay"
    );


  const voice =
    document.getElementById(
      "openingVN"
    );


  if (!button) {
    return;
  }


  button.onclick =
    async () => {

      try {

        if (
          audio.paused
        ) {

          await audio.play();


          button.textContent =
            "Ⅱ";


          voice.classList.add(
            "playing"
          );


          enableContinueImmediately();

        }

        else {

          audio.pause();


          button.textContent =
            "▶";


          voice.classList.remove(
            "playing"
          );

        }

      }

      catch (error) {

        enableContinueImmediately();

        alert(
          "VN belum bisa diputar. Pastikan file vn.mp3 tersedia."
        );

      }

    };

}


setupVoiceButton();


/* =====================================================
   AUDIO TIME
===================================================== */

audio.addEventListener(
  "timeupdate",
  () => {

    const current =
      Math.floor(
        audio.currentTime
      );


    const minutes =
      Math.floor(
        current / 60
      );


    const seconds =
      current % 60;


    document.getElementById(
      "voiceTime"
    ).textContent =
      `${minutes}:${String(seconds).padStart(2, "0")}`;

  }
);


/* =====================================================
   AUDIO PLAY
===================================================== */

audio.addEventListener(
  "play",
  () => {

    openingPlayed = true;


    const voice =
      document.getElementById(
        "openingVN"
      );


    const button =
      document.getElementById(
        "openingPlay"
      );


    voice.classList.add(
      "playing"
    );


    button.textContent =
      "Ⅱ";


    enableContinueImmediately();

  }
);


/* =====================================================
   AUDIO PAUSE
===================================================== */

audio.addEventListener(
  "pause",
  () => {

    const voice =
      document.getElementById(
        "openingVN"
      );


    const button =
      document.getElementById(
        "openingPlay"
      );


    voice.classList.remove(
      "playing"
    );


    button.textContent =
      "▶";

  }
);


/* =====================================================
   AUDIO ENDED
===================================================== */

audio.addEventListener(
  "ended",
  () => {

    const voice =
      document.getElementById(
        "openingVN"
      );


    const button =
      document.getElementById(
        "openingPlay"
      );


    voice.classList.remove(
      "playing"
    );


    button.textContent =
      "▶";

  }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

  return String(text)
    .replace(
      /[&<>"']/g,
      character => {

        const map = {

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"

        };


        return map[
          character
        ];

      }
    );

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addBubble(
  text,
  side = "boy"
) {

  const element =
    document.createElement(
      "div"
    );


  element.className =
    "msg";


  if (
    side === "girl"
  ) {

    element.classList.add(
      "girl"
    );

  }


  element.innerHTML =
    escapeHTML(text)
    +
    `
      <div class="meta">
        ${currentTime()}
        ${
          side === "girl"
            ? " ✓✓"
            : ""
        }
      </div>
    `;


  chat.appendChild(
    element
  );


  chat.scrollTop =
    chat.scrollHeight;


  return element;

}


/* =====================================================
   TYPING INDICATOR
===================================================== */

function createTypingIndicator() {

  const element =
    document.createElement(
      "div"
    );


  element.className =
    "typing-message";


  element.innerHTML = `

    <div class="typing-dots">

      <span></span>
      <span></span>
      <span></span>

    </div>

  `;


  chat.appendChild(
    element
  );


  chat.scrollTop =
    chat.scrollHeight;


  return element;

}


/* =====================================================
   TYPEWRITER
===================================================== */

function typeText(
  element,
  text,
  speed = 35
) {

  return new Promise(
    resolve => {

      let index = 0;


      const interval =
        setInterval(
          () => {

            if (
              index >= text.length
            ) {

              clearInterval(
                interval
              );

              resolve();

              return;

            }


            element.textContent +=
              text[index];


            index++;


            chat.scrollTop =
              chat.scrollHeight;


          },
          speed
        );

    }
  );

}


/* =====================================================
   SHOW MESSAGE DENGAN EFEK KETIKAN
===================================================== */

async function showMessage(
  text,
  side = "boy"
) {

  /*
    STATUS "mengetik..."
  */

  document.getElementById(
    "chatStatus"
  ).textContent =
    "mengetik…";


  /*
    Munculkan titik-titik
  */

  const typing =
    createTypingIndicator();


  /*
    Tunggu sebentar sebelum pesan
    benar-benar muncul.
  */

  await wait(900);


  /*
    Hapus indikator mengetik
  */

  typing.remove();


  /*
    Buat bubble kosong
  */

  const element =
    document.createElement(
      "div"
    );


  element.className =
    "msg";


  if (
    side === "girl"
  ) {

    element.classList.add(
      "girl"
    );

  }


  /*
    Text area
  */

  const textElement =
    document.createElement(
      "span"
    );


  element.appendChild(
    textElement
  );


  /*
    Tambahkan bubble
  */

  chat.appendChild(
    element
  );


  chat.scrollTop =
    chat.scrollHeight;


  /*
    Efek ketik
  */

  await typeText(
    textElement,
    text,
    32
  );


  /*
    Timestamp muncul setelah
    pesan selesai diketik.
  */

  const meta =
    document.createElement(
      "div"
    );


  meta.className =
    "meta";


  meta.textContent =
    currentTime()
    +
    (
      side === "girl"
        ? " ✓✓"
        : ""
    );


  element.appendChild(
    meta
  );


  /*
    Status kembali online
  */

  document.getElementById(
    "chatStatus"
  ).textContent =
    "online";


  /*
    Jeda sebelum pesan berikutnya.
  */

  await wait(700);

}


/* =====================================================
   WAIT
===================================================== */

function wait(
  milliseconds
) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        milliseconds
      )
  );

}


/* =====================================================
   START STORY
===================================================== */

async function startStory() {

  if (
    !notificationOpened
  ) {

    openChat();

  }


  if (
    started ||
    locked
  ) {

    return;

  }


  started = true;

  locked = true;


  /* =================================================
     BACKGROUND MUSIC
  ================================================== */

  try {

    music.volume = 0.35;

    await music.play();

  }

  catch (error) {

    console.log(
      "Background music belum dapat dimainkan."
    );

  }


  /* =================================================
     BUTTON HILANG
  ================================================== */

  choicesBox.innerHTML = `

    <div class="choices-title">
      Pesan untuk kamu ❤️
    </div>

  `;


  /* =================================================
     MESSAGE 1
  ================================================== */

  await showMessage(
    "Happy anniversary 2 bulan, sayangku! ❤️🥺"
  );


  /* =================================================
     MESSAGE 2
  ================================================== */

  await showMessage(
    "Nggak terasa ya, kita sudah bersama selama 2 bulan. Walaupun hubungan kita dipisahkan oleh jarak, aku bersyukur karena sampai hari ini kita masih bisa saling mencintai, menjaga, dan mempertahankan hubungan ini."
  );


  /* =================================================
     MESSAGE 3
  ================================================== */

  await showMessage(
    "Jujur, LDR memang nggak mudah. Ada saatnya aku kangen banget, ingin bertemu, ingin memeluk kamu, dan ingin menghabiskan waktu bersama tanpa harus terhalang jarak. Tapi aku percaya, sejauh apa pun jarak memisahkan kita, kalau kita sama-sama punya niat dan kesetiaan, semuanya pasti bisa kita lewati."
  );


  /* =================================================
     MESSAGE 4
  ================================================== */

  await showMessage(
    "Terima kasih sudah hadir di hidupku, sudah sabar menghadapi aku, dan sudah memilih untuk tetap bertahan bersamaku. Aku nggak minta hubungan kita selalu sempurna, aku cuma ingin kita selalu saling mengerti, saling percaya, dan nggak mudah menyerah."
  );


  /* =================================================
     MESSAGE 5
  ================================================== */

  await showMessage(
    "Semoga 2 bulan ini menjadi awal dari perjalanan panjang kita. Aku ingin anniversary berikutnya kita rayakan dengan lebih banyak kebahagiaan, bahkan semoga nanti kita bisa merayakannya sambil berpelukan, bukan lagi lewat layar HP."
  );


  /* =================================================
     MESSAGE 6
  ================================================== */

  await showMessage(
    "I love you, sayang. Jaga hati dan diri kamu baik-baik di sana. Aku sayang kamu, hari ini, besok, dan seterusnya. ❤️😘"
  );


  /* =================================================
     JEDA
  ================================================== */

  await wait(500);


  /* =================================================
     FINAL MESSAGE + PHOTO
  ================================================== */

  const photoBubble =
    document.createElement(
      "div"
    );


  photoBubble.className =
    "msg";


  photoBubble.innerHTML = `

    2 bulan bersama kamu,
    dan aku masih ingin lebih lama lagi. ❤️

    <img
      class="final-photo"
      src="foto-akhir.jpg"
      alt="Foto kenangan kita"
    >

    <div class="meta">
      ${currentTime()}
    </div>

  `;


  chat.appendChild(
    photoBubble
  );


  chat.scrollTop =
    chat.scrollHeight;


  await wait(500);


  /* =================================================
     FINAL AREA
  ================================================== */

  choicesBox.innerHTML = `

    <div class="choices-title">

      Happy anniversary
      2 bulan, sayangku ❤️🥺

    </div>

    <div
      style="
        font-size:10px;
        line-height:1.6;
        color:#c6d6de;
        text-align:center;
        padding:4px 7px;
      "
    >

      Semoga 2 bulan ini
      menjadi awal dari
      perjalanan panjang kita.

      <br><br>

      I love you, sayang ❤️

    </div>

  `;


  document.getElementById(
    "input"
  ).textContent =
    "I love you sayang ❤️";


  locked = false;

}


/* =====================================================
   START BUTTON
===================================================== */

document
  .getElementById(
    "startChoice"
  )
  .addEventListener(
    "click",
    startStory
  );


/* =====================================================
   RESTART
===================================================== */

function restart() {

  audio.pause();

  audio.currentTime = 0;


  music.pause();

  music.currentTime = 0;


  openingPlayed = false;

  started = false;

  locked = false;

  notificationOpened = false;


  chat.innerHTML = `

    <div
      class="day-divider"
      id="todayDivider"
    >
      HARI INI
    </div>


    <div class="msg">

      sayang, sebelum baca pesanku,
      dengerin VN ini dulu yaa 🥺❤️

      <div class="meta">
        <span class="messageTime"></span>
      </div>

    </div>


    <div
      class="voice-message"
      id="openingVN"
    >

      <div class="voice-row">

        <button
          class="voice-play"
          id="openingPlay"
        >
          ▶
        </button>


        <div class="voice-content">

          <div class="voice-label">
            Voice note anniversary
          </div>


          <div
            class="voice-wave"
            id="openingWave"
          ></div>

        </div>

      </div>


      <div class="voice-bottom">

        <span
          class="voice-duration"
        >
          0:15
        </span>


        <span
          class="voice-time"
          id="voiceTime"
        >
          00:00
        </span>

      </div>

    </div>

  `;


  createWaveform();

  setupVoiceButton();

  stampMessages();


  choicesBox.innerHTML = `

    <div
      class="choices-title"
      id="choiceTitle"
    >
      Putar VN dulu,
      lalu lanjutkan 💗
    </div>


    <button
      class="choice"
      id="startChoice"
      disabled
    >
      ▶ Putar VN pembuka dulu
    </button>

  `;


  document
    .getElementById(
      "startChoice"
    )
    .addEventListener(
      "click",
      startStory
    );


  document.getElementById(
    "input"
  ).textContent =
    "Menunggu pesan...";


  document.getElementById(
    "chatStatus"
  ).textContent =
    "online";


  document.getElementById(
    "notificationMessage"
  ).textContent =
    "sayanggg, buka yaa... ada sesuatu buat kamu ❤️🥺";


  chatRoom.classList.remove(
    "active"
  );


  home.classList.remove(
    "hidden"
  );


  updateClock();

}


/* =====================================================
   RESTART BUTTON
===================================================== */

document
  .getElementById(
    "restartButton"
  )
  .addEventListener(
    "click",
    restart
  );

</script>

</body>
